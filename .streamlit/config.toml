# Site-wide look: a research-desk style. Serif headings, plain sans body text,
# deep navy for buttons and selections.
# Colours come from the same palette the charts use.

[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f1"
textColor = "#1d1d1b"
linkColor = "#1f4e8c"
borderColor = "#e1e0d9"
baseRadius = "medium"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap, Georgia, serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[client]
toolbarMode = "minimal"
