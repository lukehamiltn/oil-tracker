# Runs the paper-trading bot on GitHub's servers, weekdays near the 4pm ET close.
#
# Times are UTC. 4pm ET is 20:00 UTC in summer and 21:00 UTC in winter, so we
# run at :20 and :40 past 19:00 and 20:00 UTC. The bot itself checks the market
# clock and only trades in the last 45 minutes before the close; other runs
# just log and exit. Running more than once a day is safe: it only trades when
# the position needs to change, and never while an order is still open.
#
# The Alpaca keys come from the repository's secrets
# (GitHub -> Settings -> Secrets and variables -> Actions).

name: Paper trading bot

on:
  schedule:
    - cron: "20,40 19,20 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
