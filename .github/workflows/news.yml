# Keeps the website's news data fresh, saved in the repository so the site
# loads it instantly and never has to wait on the news feed:
#   - every 3 hours: save the latest headlines (news_data/headlines.csv),
#     which the site shows whenever the live feed is busy
#   - once a day (and on manual runs): update each topic's coverage history
#     (news_data/timelines.csv); only recent days are re-downloaded, and any
#     topic still missing is downloaded in full
# GDELT rate-limits heavily, so each step is allowed to fail without stopping
# the other; whatever was fetched is still saved.

name: Refresh news data

on:
  schedule:
    - cron: "15 6 * * *"     # daily: coverage history + headlines
    - cron: "45 */3 * * *"   # every 3 hours: headlines only
  workflow_dispatch:         # adds a "Run workflow" button (runs both steps)

permissions:
  contents: write            # needed to save the updated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.1 requests==2.34.2
      - name: Update coverage history
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * *'
        continue-on-error: true
        run: python -u news.py update
      - name: Save latest headlines
        continue-on-error: true
        run: python -u news.py save-headlines
      - name: Save the updated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data/
          git diff --cached --quiet || (git commit -m "Refresh news data" && git pull --rebase && git push)
