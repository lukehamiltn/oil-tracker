# Keeps the website's news data fresh, saved in the repository so the site
# loads it instantly and never has to wait on the news feed:
#   - every 3 hours: refresh the market news archive (news_data/market_news/,
#     from Alpaca), which powers the headlines and the search box
#   - once a day (and on manual runs): update each topic's worldwide coverage
#     history from GDELT (news_data/timelines.csv)
# Each step is allowed to fail without stopping the other (GDELT rate-limits
# heavily); whatever was fetched is still saved.

name: Refresh news data

on:
  schedule:
    - cron: "15 6 * * *"     # daily: GDELT history + market news
    - cron: "45 */3 * * *"   # every 3 hours: market news only
  workflow_dispatch:         # adds a "Run workflow" button (runs both steps)

permissions:
  contents: write            # needed to save the updated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.1 requests==2.34.2
      - name: Update coverage history
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * *'
        continue-on-error: true
        run: python -u news.py update
      - name: Refresh market news
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u market_news.py update
      - name: Save the updated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data/
          git diff --cached --quiet || (git commit -m "Refresh news data" && git pull --rebase && git push)
