# Keeps the website's news data fresh, saved in the repository so the site
# loads it instantly and never has to wait on the news feed:
#   - every 3 hours: refresh the market news archive (news_data/market_news/,
#     from Alpaca), which powers the headlines and the search box
#   - every run: update each topic's worldwide coverage history from Media
#     Cloud (news_data/mc_timelines.csv; needs the MEDIACLOUD_API_KEY secret).
#     Only topics not yet up to date are fetched; a failed one is retried on
#     the next run. (The old GDELT file, news_data/timelines.csv, is no longer
#     updated and is only used if the Media Cloud file is missing.)
# Each step is allowed to fail without stopping the other; whatever was
# fetched is still saved.

name: Refresh news data

on:
  schedule:
    - cron: "15 6 * * *"     # daily: GDELT history + market news
    - cron: "45 */3 * * *"   # every 3 hours: market news only
  workflow_dispatch:         # adds a "Run workflow" button (runs both steps)

permissions:
  contents: write            # needed to save the updated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.1 requests==2.34.2 mediacloud==5.2.0
      - name: Update worldwide coverage (Media Cloud)
        # Only topics not yet up to date today are fetched; a topic that fails
        # is simply tried again on the next run, 3 hours later.
        continue-on-error: true
        timeout-minutes: 15
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -u mediacloud_news.py update
      - name: Save the articles behind each topic's count (Media Cloud)
        # Shown when a topic card on the site is clicked
        continue-on-error: true
        timeout-minutes: 12
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -u mediacloud_news.py stories
      - name: Update storyline coverage (Media Cloud)
        continue-on-error: true
        timeout-minutes: 8
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -u storylines.py update
      - name: Save articles from the publishers' news feeds
        continue-on-error: true
        timeout-minutes: 5
        run: python -u news_feeds.py update
      - name: Refresh market news
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u market_news.py update
      - name: Save the updated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data/
          git diff --cached --quiet || (git commit -m "Refresh news data" && git pull --rebase && git push)
