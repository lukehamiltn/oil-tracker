# Re-tests the price-forecast models and logs today's forecast, every weekday
# evening after the U.S. oil market closes (Research > Forecast model on the
# site reads the saved files).
#
# Times are UTC: 22:30 UTC is 5:30pm ET in winter, 6:30pm in summer.

name: Forecast model

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-test the models and log today's forecast
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u forecast.py save
      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data/forecast_backtest.csv news_data/forecast_log.csv
          git diff --cached --quiet || (git commit -m "Update forecast model results" && git pull --rebase && git push)
